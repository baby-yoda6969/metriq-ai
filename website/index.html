<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Metriq AI packaged commodity compliance: label scanning, case review, and rule administration." />
    <script>
      try {
        const theme = localStorage.getItem('metriq-website-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch { /* Storage may be unavailable in private browsing. */ }
    </script>
    <title>METRIQ AI — Packaged Commodity Compliance Checker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
